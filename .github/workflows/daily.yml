name: Daily radar

on:
  schedule:
    # 05:17 and 17:17 in Budapest. GitHub schedules in UTC, so both the summer and the winter times are listed
    # and the gate job below lets through only the one that matches Budapest's clock that day.
    - cron: "17 3 * * *"
    - cron: "17 4 * * *"
    - cron: "17 15 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the weekly extras (site searches, re-check company boards)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.t.outputs.go }}
    steps:
      - id: t
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          off=$(TZ=Europe/Budapest date +%z)   # +0100 in winter, +0200 in summer
          go=true
          if [ "$EVENT" = "schedule" ]; then
            case "$off|$CRON" in
              "+0200|17 3 * * *"|"+0200|17 15 * * *"|"+0100|17 4 * * *"|"+0100|17 16 * * *") go=true ;;
              *) go=false ;;
            esac
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Budapest offset $off, trigger '${CRON:-manual}', run: $go"

  collect:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the radar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar.run ${{ inputs.full && '--full' || '' }}
      - name: Save results
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || git commit -q -m "Radar run $(date -u +%F)"
          git pull -q --rebase --autostash || true
          git push -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
