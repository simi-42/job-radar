name: Daily radar

on:
  schedule:
    - cron: "17 5 * * *"   # 06:17 in Budapest in winter, 07:17 in summer
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the weekly extras (site searches, re-check company boards)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the radar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CV_TEXT: ${{ secrets.CV_TEXT }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m radar.run ${{ inputs.full && '--full' || '' }}
      - name: Save results
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || git commit -q -m "Radar run $(date -u +%F)"
          git pull -q --rebase --autostash || true
          git push -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
